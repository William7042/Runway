[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runway-money"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["truemarkets==0.3.0", "python-dotenv>=1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.115,<1"]

[tool.setuptools.packages.find]
include = ["runway_money*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
